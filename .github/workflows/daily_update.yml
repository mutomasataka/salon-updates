on:
  schedule:
    # 毎日 日本時間 朝6:00 (UTC 21:00) に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHubのブラウザから手動で即時実行可能
  push:
    branches:
      - main

# GitHub Pages へのデプロイ権限設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 各サイトの更新チェックとHTML生成
        env:
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: |
          python scripts/update_feeds.py

      - name: GitHub Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
